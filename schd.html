<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Unlock Schedule</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b0d10;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    .unlock {
      width: min(420px, 100%);
      background: #12151a;
      border: 1px solid #262c35;
      padding: 28px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #8ab4f8;
    }

    h1 {
      margin: 6px 0 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    p {
      margin: 0 0 20px;
      color: #9aa0a6;
      font-size: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #8b929c;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #0d1014;
      border: 1px solid #2f3742;
      color: #e8eaed;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #8ab4f8;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #8ab4f8;
      border: none;
      color: #0b0d10;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      background: #a8c7fa;
    }

    button:disabled {
      opacity: .6;
      cursor: progress;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      color: #fca5a5;
      font-size: 12px;
    }

    .status.busy {
      color: #8ab4f8;
    }

    .hint {
      margin: 18px 0 0;
      color: #6b7280;
      font-size: 11px;
    }

    code {
      background: #0d1014;
      border: 1px solid #262c35;
      padding: 1px 4px;
      color: #c7ccd2;
    }
  </style>
</head>

<body>
  <main class="unlock">
    <div class="eyebrow">SCHEDULES</div>
    <h1>Unlock schedule</h1>
    <p>Enter the access key to decrypt this page. Decryption happens in your browser; the key is never sent anywhere.
    </p>

    <form id="keyForm">
      <label for="keyInput">Access key</label>
      <input type="password" id="keyInput" placeholder="Enter key..." autocomplete="off" spellcheck="false" required
        autofocus>
      <button type="submit" id="unlockBtn">Unlock</button>
    </form>

    <div id="status" class="status" role="status"></div>

    <p class="hint">A link ending in <code>#key=...</code> unlocks automatically. The key is removed from the address
      after a successful unlock.</p>
  </main>

    const ITERATIONS = PAYLOAD.iterations;

    function base64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptPayload(passphrase) {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(passphrase),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(PAYLOAD.salt),
          iterations: ITERATIONS,
          hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(PAYLOAD.iv) },
        aesKey,
        base64ToBytes(PAYLOAD.ciphertext)
      );

      return new TextDecoder().decode(plaintext);
    }

    function keyFromHash() {
      const hash = location.hash.replace(/^#/, "");
      if (!hash) return null;
      return new URLSearchParams(hash).get("key");
    }

    async function attemptUnlock(key) {
      const status = document.getElementById("status");
      const button = document.getElementById("unlockBtn");
      status.className = "status busy";
      status.textContent = "Deriving key...";
      button.disabled = true;

      try {
        const html = await decryptPayload(key);
        if (location.hash) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        status.className = "status";
        status.textContent = "Invalid key or corrupted data.";
        button.disabled = false;
        document.getElementById("keyInput").select();
      }
    }

    document.getElementById("keyForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const key = document.getElementById("keyInput").value;
      if (key) attemptUnlock(key);
    });

    const hashKey = keyFromHash();
    if (hashKey) attemptUnlock(hashKey);
  </script>
