        function base64ToArrayBuffer(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function decryptPayload(passphrase) {
            const encoder = new TextEncoder();
            const rawKey = encoder.encode(passphrase);

            // 1. Import raw passphrase as PBKDF2 base key
            const baseKey = await crypto.subtle.importKey(
                "raw",
                rawKey,
                {name: "PBKDF2"},
                false,
                ["deriveKey"]
            );

            // 2. Derive the AES-256-GCM key
            const salt = base64ToArrayBuffer(PAYLOAD.salt);
            const aesKey = await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: PAYLOAD.iterations,
                    hash: "SHA-256"
                },
                baseKey,
                {name: "AES-GCM", length: 256},
                false,
                ["decrypt"]
            );

            // 3. Decrypt ciphertext
            const iv = base64ToArrayBuffer(PAYLOAD.iv);
            const ciphertext = base64ToArrayBuffer(PAYLOAD.ciphertext);

            const decryptedBuffer = await crypto.subtle.decrypt(
                {name: "AES-GCM", iv: iv},
                aesKey,
                ciphertext
            );

            return new TextDecoder().decode(decryptedBuffer);
        }

        async function attemptUnlock(key) {
            const errEl = document.getElementById("errorMsg");
            errEl.textContent = "";

            try {
                const html = await decryptPayload(key);
                // Replace page content with decrypted HTML
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                errEl.textContent = "Invalid key or corrupted data.";
            }
        }

        // Check URL parameters on load
        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const urlKey = params.get("key");

            if (urlKey) {
                attemptUnlock(urlKey);
            }

            document.getElementById("keyForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const enteredKey = document.getElementById("keyInput").value;
                attemptUnlock(enteredKey);
            });
        });
    </script>
